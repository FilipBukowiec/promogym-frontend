<section>
  <h1>Announcements</h1>
</section>

<section>
  <div>
    <img class="image" src="/assets/images/microphone.svg" alt="Microphone" />
    <form (ngSubmit)="addAnnouncement()" enctype="multipart/form-data" #announcementForm="ngForm">
      
      <div>
        <label for="file">Plik</label>
        <input 
          type="file" 
          (change)="onFileSelected($event)" 
          name="file" 
          id="file" 
          required 
  
          />
      </div>

      <div>
        <label for="description">Description</label>
        <input 
          type="text" 
          [(ngModel)]="description" 
          name="description" 
          id="description" 
          required
          #descriptionInput="ngModel"
          />
      </div>

      <div>
        <label for="scheduleType">Type of harmonogram</label>
        <select 
          [(ngModel)]="scheduleType" 
          name="scheduleType" 
          id="scheduleType"
          required
          #scheduleTypeInput="ngModel"
          >
          <option value="oneTime">One time</option>
          <option value="cyclic">Cyclic</option>
        </select>
      </div>

      <!-- Cyclic schedule -->
      <div class="cyclic" *ngIf="scheduleType === 'cyclic'">
        <table>
          <tr>
            <td>
              <div class="cyclic">
                <label for="daysOption">Wybór dni</label>
                <select 
                  [(ngModel)]="daysOption" 
                  name="daysOption" 
                  id="daysOption"
                  required
                  #daysOptionInput="ngModel"
                  >
                  <option value="allDays">All days</option>
                  <option value="selectedDays">Selected days</option>
                </select>
                <div *ngIf="daysOption === 'selectedDays'">
                  <label>Dni tygodnia</label>
                  <div *ngFor="let day of daysOfWeek; let i = index">
                    <input 
                      type="checkbox" 
                      [(ngModel)]="selectedDays[i]" 
                      name="day{{i}}" 
                      id="day{{i}}" 
                    />
                    <label for="day{{i}}">{{ day }}</label>
                  </div>
                </div>
              </div>
            </td>
            <td>
              <div class="cyclic">
                <label for="hoursOption">Wybór godzin</label>
                <select 
                  [(ngModel)]="hoursOption" 
                  name="hoursOption" 
                  id="hoursOption"
                  required
                  #hoursOptionInput="ngModel"
                  >
                  <option value="allHours">All hours</option>
                  <option value="selectedHours">Selected hours</option>
                </select>
                <div *ngIf="hoursOption === 'selectedHours'">
                  <label>Wybierz godziny</label>
                  <div *ngFor="let hour of hours; let i = index">
                    <input 
                      type="checkbox" 
                      [(ngModel)]="selectedHours[i]" 
                      name="hour{{i}}" 
                      id="hour{{i}}" 
                    />
                    <label for="hour{{i}}">{{ hour }}:00</label>
                  </div>
                </div>
              </div>
            </td>
            <td>
              <div class="cyclic">
                <label for="minutesOption">Wybór minut</label>
                <select 
                  [(ngModel)]="minutesOption" 
                  name="minutesOption" 
                  id="minutesOption"
                  required
                  #minutesOptionInput="ngModel"
                  >
                  <option value="allMinutes">All minutes</option>
                  <option value="selectedMinutes">Selected minutes</option>
                </select>
                <div *ngIf="minutesOption === 'selectedMinutes'">
                  <label>Wybierz minuty</label>
                  <div *ngFor="let minute of minutes; let i = index">
                    <input 
                      type="checkbox" 
                      [(ngModel)]="selectedMinutes[i]" 
                      name="minute{{i}}" 
                      id="minute{{i}}" 
                    />
                    <label for="minute{{i}}">{{ minute }} min</label>
                  </div>
                </div>
              </div>
            </td>
          </tr>
        </table>
      </div>

      <!-- One-time schedule -->
      <div *ngIf="scheduleType === 'oneTime'">
        <label for="oneTimeDate">Data i godzina (jednorazowe)</label>
        <input 
          type="datetime-local" 
          [(ngModel)]="scheduledTime" 
          name="oneTimeDate" 
          id="oneTimeDate" 
          required
          #oneTimeDateInput="ngModel"
          />
      </div>

      <button type="submit" [disabled]="announcementForm.invalid">Dodaj ogłoszenie</button>
    </form>
  </div>
</section>

<section>
<table>
  <thead>
    <tr>
      <th>Filename</th>
    <th>Preview</th>
      <th>Opis</th>
      <th>Typ</th>
      <th>Data / Harmonogram</th>
      <th>Akcje</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let announcement of announcementList">
      <td>{{announcement.fileName}}</td>
<td></td>
      <td>{{ announcement.description }}</td>
      <td>{{ announcement.scheduleType }}</td>
      <td>{{ getScheduledTime(announcement) }}</td>
      <td>
        <button (click)="deleteAnnouncement(announcement._id)">Usuń</button>
      </td>
    </tr>
  </tbody>
</table>
</section>
