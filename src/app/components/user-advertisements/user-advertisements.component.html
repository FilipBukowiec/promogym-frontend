<h2>Sponsored content is included as part of your current plan.</h2><br>
    <div class="ads-container">
      <div *ngFor="let ads of advertisementsList; let i = index">
        <img *ngIf="ads.fileType.startsWith('image')" class="media" [src]="getFullFilePath(ads.filePath)"
          alt="{{ ads.fileName }}" />
        <video *ngIf="ads.fileType.startsWith('video')" class="media" [src]="getFullFilePath(ads.filePath)"
          controls></video>
      </div>
    </div>
